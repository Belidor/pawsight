# Broker WITH A PASSWORD for docker mode. docker-compose.yml picks this file
# itself if mosquitto/passwd exists next to it (created by install.sh for a new
# install or by `python -m pawsight.authsetup --mqtt` for an existing one). No file:
# the old mosquitto.conf with anonymous access is used.
#
# Why a password when the port is on 127.0.0.1 anyway: loopback also means any
# process on this machine. An anonymous broker lets any of them send the detector
# commands (pan the camera, delete dataset frames, start training) and read
# camera frames from pawsight/observations.
listener 1883
allow_anonymous false
password_file /mosquitto/auth/passwd
acl_file /mosquitto/auth/acl
persistence false
log_dest stdout
log_type warning
