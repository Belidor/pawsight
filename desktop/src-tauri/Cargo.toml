[package]
name = "pawsight-desktop"
version = "0.1.0"
description = "pawsight desktop app: installs and runs the local dog camera"
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.77"

[lib]
name = "pawsight_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
