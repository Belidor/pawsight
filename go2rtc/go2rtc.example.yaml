# Template. The real go2rtc.yaml is created from it (install.sh does this)
# and is NOT committed: it ends up holding either the camera password right in
# the RTSP URL or a Mi account token like "V1:***". The file is in .gitignore.
#
# Everything listens ONLY on loopback: nothing is exposed to the outside or the LAN.

api:
  listen: "127.0.0.1:1984"
  # Basic auth for the API and WebUI. Loopback is reachable from ANY page in the
  # owner's browser, and via DNS rebinding a foreign site could read
  # /api/config (camera password, Mi token) and change streams. On first
  # install, install.sh writes a random username and password here; the dashboard
  # and start.sh read them from this file (in docker mode, from .env:
  # GO2RTC_USER/GO2RTC_PASS). An empty username means no auth.
  # local_auth: true is required: without it go2rtc lets 127.0.0.1 in without
  # a password, and DNS rebinding comes precisely from 127.0.0.1.
  username: ""
  password: ""
  local_auth: true

rtsp:
  listen: "127.0.0.1:8554"

# WebRTC is not needed (everything is pulled over RTSP), and by default it listens
# on all interfaces, including the LAN. Pin it to loopback.
webrtc:
  listen: "127.0.0.1:8555"
  candidates:
    - 127.0.0.1:8555
  # STUN is off ON PURPOSE. With it, a browser on this same machine picked an
  # srflx pair via the router's public IP (NAT hairpin): rtt 15 ms and a
  # ~600 ms jitter buffer instead of a fraction of a millisecond. And Chrome
  # does not pair with a loopback candidate at all, so WebRTC does not work here
  # in principle: video goes over MSE through the dashboard's loopback proxy.
  ice_servers: []

log:
  level: info
  format: text

streams:
  # --- option 1: a regular IP camera with RTSP (filled in by install.sh --rtsp) ---
  # The exact path depends on the manufacturer; see its documentation:
  #   Hikvision  rtsp://user:pass@ADDR:554/Streaming/Channels/101
  #   Dahua      rtsp://user:pass@ADDR:554/cam/realmonitor?channel=1&subtype=0
  #   Reolink    rtsp://user:pass@ADDR:554/h264Preview_01_main
  #   Tapo/TP-L. rtsp://user:pass@ADDR:554/stream1
  dog_cam: ""

  # If the camera has a second, lower-resolution stream, add it separately
  # and set it in .env as PAWSIGHT_DETECT_RTSP. 640x360 is enough for the
  # detector, and a small stream noticeably eases both the network and the decoder.
  # dog_cam_sd: rtsp://user:pass@ADDR:554/stream2

  # --- option 2: a Xiaomi camera over P2P (install.sh --xiaomi) ---
  # Do NOT write this section by hand: go2rtc adds it itself after you
  # sign in to your Mi account via the WebUI at http://127.0.0.1:1984 (Add → Xiaomi).
  # It will look roughly like this (with your values):
  #
  # xiaomi:
  #   <mi_user_id>: "V1:***"
  #
  # streams:
  #   dog_cam: xiaomi://<mi_user_id>:cn@<ip>?did=<did>&model=<model>&subtype=2
