name: desktop app

# Builds the installers for every platform. Unsigned for now: macOS asks to
# confirm the first open (right click -> Open), Windows SmartScreen shows
# "More info -> Run anyway". See desktop/README.md.

on:
  push:
    paths: ["desktop/**", "pawsight/**", "requirements.txt", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", "pawsight/**", "requirements.txt", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The Python side of the app (supervisor, broker, appinit) on Windows, where
  # the CLI install never ran. The full suite runs on Linux and macOS in ci.yml.
  python-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install "paho-mqtt>=2.0" "httpx>=0.27" "aiohttp>=3.9" "pyyaml>=6" "python-dotenv>=1" "cryptography>=42" "amqtt>=0.12,<0.13" "psutil>=5.9" "opencv-python-headless>=4.10" "numpy>=1.26" "lap>=0.5"
      - name: App tests
        run: python -m unittest tests.test_runner tests.test_broker tests.test_appinit tests.test_train_pause -v

  build:
    name: build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - name: Linux arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Bundled binaries (uv, go2rtc)
        run: python desktop/fetch_sidecars.py --target ${{ matrix.target }}
      - name: Build
        working-directory: desktop
        run: |
          npm ci
          npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: pawsight-${{ matrix.target }}
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error
