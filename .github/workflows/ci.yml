name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The suite needs no torch or YOLO weights: model code is behind fakes, and
      # the few tests that need OpenCV skip themselves without it. Installing
      # torch here would cost minutes and gigabytes for nothing.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "paho-mqtt>=2.0" "httpx>=0.27" "aiohttp>=3.9" "pyyaml>=6" \
            "python-dotenv>=1" "cryptography>=42" "opencv-python-headless>=4.10" \
            "numpy>=1.26" "lap>=0.5" ruff
      - name: Lint
        run: ruff check .
      - name: Shell syntax
        run: bash -n install.sh start.sh stop.sh scripts/build_go2rtc.sh
      - name: Tests
        run: python -m unittest discover -s tests
