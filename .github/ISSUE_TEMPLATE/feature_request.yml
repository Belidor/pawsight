name: Feature request
description: An idea that would make pawsight more useful
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What do you want to know about your dog, or what is awkward today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: How you imagine it working. Rough is fine.
  - type: checkboxes
    id: local
    attributes:
      label: Local first
      options:
        - label: This can work without sending video or images to a cloud service.
