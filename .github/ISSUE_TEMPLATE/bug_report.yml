name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not paste passwords, tokens, RTSP URLs with
        credentials, `.env` or `go2rtc/go2rtc.yaml`.** Logs from the dashboard's
        Logs tab are already scrubbed; anything else, check before pasting.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you saw instead.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS (Apple Silicon)
        - Linux with an NVIDIA GPU
        - Linux, CPU only
    validations:
      required: true
  - type: input
    id: camera
    attributes:
      label: Camera
      description: Brand and model, and whether it is RTSP or Xiaomi P2P.
      placeholder: Tapo C200, RTSP
  - type: textarea
    id: selftest
    attributes:
      label: Self-test output
      description: Output of `.venv/bin/python -m pawsight selftest`.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: From `storage/detect.log`, `storage/brain.log` or the dashboard's Logs tab.
      render: text
