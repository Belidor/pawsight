# The broker is reachable only inside the compose network and from the host's loopback.
# It is not published outside: see the port binding in docker-compose.yml.
#
# This is the variant WITHOUT a password, for installs made before passwords existed.
# A new install gets mosquitto/passwd, and then docker-compose.yml runs
# mosquitto/auth.conf (password + ACL). To migrate an existing install see
# DOCUMENTATION.md, "Passwords for go2rtc and the broker".
listener 1883
allow_anonymous true
persistence false
log_dest stdout
log_type warning
